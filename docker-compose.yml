services:
  # ─────────────────────────────────────────
  # Base de données PostgreSQL
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cargonotify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - cargonotify-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────
  # Backend Node.js / Express
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cargonotify-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    volumes:
      - wa_sessions:/app/whatsapp_sessions
    networks:
      - cargonotify-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────
  # Frontend React + Nginx (exposé sur :3000)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cargonotify-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - cargonotify-net
    depends_on:
      backend:
        condition: service_healthy

  # ─────────────────────────────────────────
  # Dozzle — Monitoring des Logs Docker (:8080)
  # ─────────────────────────────────────────
  dozzle:
    image: amir20/dozzle:latest
    container_name: cargonotify-dozzle
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - cargonotify-net

# ─────────────────────────────────────────
# Réseaux
# ─────────────────────────────────────────
networks:
  cargonotify-net:
    driver: bridge

# ─────────────────────────────────────────
# Volumes persistants
# ─────────────────────────────────────────
volumes:
  pg_data:
    driver: local
  wa_sessions:
    driver: local
